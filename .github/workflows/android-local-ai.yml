name: Validate Android local AI
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/android-local-ai.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/android-local-ai.yml']
permissions:
  contents: read
concurrency:
  group: android-local-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run prepare:local-ai
      - run: npx expo prebuild --platform android --no-install
      - name: Compile Gemini Nano bridge and bundled local inference runtime
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocket-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
