name: Validate MVP
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker build -t pocket-api:test .
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-pocket
          EXPO_PUBLIC_FIREBASE_API_KEY: fake-emulator-api-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: apps/mobile/test-results
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.2'
      - run: pip install PyYAML==6.0.3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: python scripts/validate-platform.py
      - name: Check generated AI configuration
        run: |
          python scripts/generate-gitops-base.py
          git diff --exit-code -- infra/gitops/base
