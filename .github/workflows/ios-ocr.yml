name: Validate iOS OCR
on:
  workflow_dispatch:
    inputs:
      simulator_url:
        description: 'Optional matching EAS simulator artifact; repack JS instead of recompiling native code'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-ocr.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-ocr.yml'
permissions:
  contents: read
concurrency:
  group: ios-ocr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-pocket
      EXPO_PUBLIC_FIREBASE_API_KEY: fake-emulator-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-pocket.firebaseapp.com
      EXPO_PUBLIC_AUTH_EMULATOR_URL: ''
      EXPO_PUBLIC_API_URL: https://backend.normiesai.com
      EXPO_PUBLIC_API_US_URL: https://backend.normiesai.com
      EXPO_PUBLIC_API_SG_URL: https://sg.backend.normiesai.com
      EXPO_PUBLIC_LOCAL_AI_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        env:
          RNLLAMA_SKIP_POSTINSTALL: ${{ inputs.simulator_url && '1' || '0' }}
      - run: npm run prepare:local-ai
        if: ${{ !inputs.simulator_url }}
      - name: Check Expo native dependency compatibility
        run: npx expo install --check
      - name: Test Apple Vision against PNG, HEIC and rotated receipt fixtures
        run: npm run test:ios-ocr
      - name: Verify native model integrity checks
        run: npm run test:model-integrity
      - name: Generate iOS project and install native modules
        if: ${{ !inputs.simulator_url }}
        run: npx expo prebuild --platform ios
      - name: Compile the release iOS app, OCR and separate AI modules
        if: ${{ !inputs.simulator_url }}
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/PocketBudget.xcworkspace -scheme PocketBudget -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/pocket-ios-build ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > /tmp/pocket-ios-build.log 2>&1 || { tail -120 /tmp/pocket-ios-build.log; exit 1; }
      - name: Download matching simulator runtime
        if: ${{ inputs.simulator_url }}
        run: python3 ../../scripts/download-ios-simulator.py
        env:
          POCKET_SIMULATOR_URL: ${{ inputs.simulator_url }}
      - name: Repack current JavaScript into the matching native runtime
        if: ${{ inputs.simulator_url }}
        run: |
          mkdir -p /tmp/pocket-ios-build/Build/Products/Release-iphonesimulator
          npx --yes @expo/repack-app --platform ios --source-app /tmp/pocket-native/PocketBudget.app --output /tmp/pocket-ios-build/Build/Products/Release-iphonesimulator/PocketBudget.app --js-bundle-only --embed-bundle-assets
      - name: Launch the release app and verify account-free budgeting
        run: python3 ../../scripts/smoke-ios-launch.py /tmp/pocket-ios-build/Build/Products/Release-iphonesimulator/PocketBudget.app --local-ai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-ocr-build-log
          path: |
            /tmp/pocket-ios-build.log
            /tmp/pocket-ios-runtime.log
            /tmp/pocket-ios-launch.png
            ~/Library/Logs/DiagnosticReports/PocketBudget*
          retention-days: 7
