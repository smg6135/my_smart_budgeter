name: Validate iOS OCR
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-ocr.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-ocr.yml'
permissions:
  contents: read
concurrency:
  group: ios-ocr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-pocket
      EXPO_PUBLIC_FIREBASE_API_KEY: fake-emulator-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-pocket.firebaseapp.com
      EXPO_PUBLIC_AUTH_EMULATOR_URL: ''
      EXPO_PUBLIC_API_URL: https://backend.normiesai.com
      EXPO_PUBLIC_API_US_URL: https://backend.normiesai.com
      EXPO_PUBLIC_API_SG_URL: https://sg.backend.normiesai.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run prepare:local-ai
      - name: Check Expo native dependency compatibility
        run: npx expo install --check
      - name: Test Apple Vision against PNG, HEIC and rotated receipt fixtures
        run: npm run test:ios-ocr
      - name: Verify native model integrity checks
        run: npm run test:model-integrity
      - name: Generate iOS project and install native modules
        run: npx expo prebuild --platform ios
      - name: Compile the release iOS app, OCR and separate AI modules
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/PocketBudget.xcworkspace -scheme PocketBudget -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/pocket-ios-build CODE_SIGNING_ALLOWED=NO build > /tmp/pocket-ios-build.log 2>&1 || { tail -120 /tmp/pocket-ios-build.log; exit 1; }
      - name: Launch the release app and verify account-free budgeting
        run: python3 ../../scripts/smoke-ios-launch.py /tmp/pocket-ios-build/Build/Products/Release-iphonesimulator/PocketBudget.app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-ocr-build-log
          path: |
            /tmp/pocket-ios-build.log
            /tmp/pocket-ios-runtime.log
            /tmp/pocket-ios-launch.png
            ~/Library/Logs/DiagnosticReports/PocketBudget*
          retention-days: 7
