apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocket-sg
  namespace: argocd
spec:
  project: pocket
  source:
    repoURL: https://github.com/smg6135/my_smart_budgeter.git
    targetRevision: main
    path: infra/gitops/overlays/sg
  destination:
    server: https://kubernetes.default.svc
    namespace: pocket
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: api
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: litellm
    jsonPointers:
    - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
